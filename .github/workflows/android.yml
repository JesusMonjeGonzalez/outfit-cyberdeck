name: Android build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
        with:
          # El default es "tools platform-tools"; el paquete "tools" esta retirado
          # y sdkmanager falla al no encontrarlo.
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: ./gradlew :composeApp:assembleDebug
      - name: Compile desktop target
        run: ./gradlew :composeApp:compileKotlinDesktop
      - name: Run portable domain tests
        run: ./gradlew :composeApp:desktopTest
